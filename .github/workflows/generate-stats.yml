name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 3 * * *"   # runs every night at 3am UTC
  workflow_dispatch:       # allows manual trigger from Actions tab
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats images
        uses: jstrieb/github-stats@master
        with:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXCLUDED: ""
          EXCLUDED_LANGS: ""
          INCLUDE_FORKED_REPOS: "false"
          EXCLUDE_CONTRIB_REPOS: "false"
          EXCLUDE_ARCHIVE_REPOS: "false"
          EXCLUDE_DISABLED_REPOS: "false"
          EXCLUDE_PRIVATE_REPOS: "false"
